[package]
name = "langgraph-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust port of LangGraph: stateful node orchestration with channels, conditional routing, parallel supersteps, checkpointing and human-in-the-loop interrupts."
license = "MIT"
repository = "https://github.com/myhMARS/langgraph-rs"
readme = "README.md"
keywords = ["langgraph", "graph", "agent", "orchestration", "workflow"]
categories = ["asynchronous", "data-structures"]

# Interrupts carry their payload inline (public API); boxing the error would break it.
[lints.clippy]
result_large_err = "allow"

[lib]
name = "langgraph_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"

# Optional Python bindings. Build with `--features python` and import the resulting
# extension module (or use maturin with the bundled pyproject.toml).
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", optional = true, features = ["tokio-runtime"] }

# Optional Tokio integration: `AsyncStateGraph` for async nodes and concurrent
# supersteps on a Tokio runtime.
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
futures = { version = "0.3", optional = true }

# Optional persistent checkpointers (adapters::sqlite / redis / postgres).
rusqlite = { version = "0.32", optional = true, default-features = false }
redis = { version = "0.27", optional = true, default-features = false, features = ["aio", "tokio-comp", "connection-manager"] }
postgres = { version = "0.19", optional = true }
tokio-postgres = { version = "0.7", optional = true }
regex = { version = "1.13.1", features = ["std"] }
sha1 = "0.11.0"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[features]
default = []
python = ["dep:pyo3"]
python-async = ["python", "async", "dep:pyo3-async-runtimes"]
async = ["dep:tokio", "dep:futures"]
sqlite = ["dep:rusqlite"]
msgpack = []
redis = ["dep:redis"]
postgres = ["dep:postgres", "dep:tokio-postgres"]

[dev-dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Benchmark and comparison sources live under `benchmarks/`; only the targets are declared here.
[[bench]]
name = "bench_rust"
path = "benchmarks/rust/bench_rust.rs"
harness = false

# Per-feature examples: each feature keeps its LangGraph reference, the Python binding and the
# native Rust version side by side under `examples/<feature>/`.
[[example]]
name = "quickstart_native"
path = "examples/quickstart/native_demo.rs"

[[example]]
name = "state_reducers_native"
path = "examples/state_reducers/native_demo.rs"

[[example]]
name = "interrupt_native"
path = "examples/interrupt/native_demo.rs"

[[example]]
name = "streaming_native"
path = "examples/streaming/native_demo.rs"

[[example]]
name = "subgraph_native"
path = "examples/subgraph/native_demo.rs"

[[example]]
name = "async_native"
path = "examples/async/native_demo.rs"

[[example]]
name = "routing_native"
path = "examples/routing/native_demo.rs"

[[example]]
name = "checkpointing_native"
path = "examples/checkpointing/native_demo.rs"

[[example]]
name = "tools_native"
path = "examples/tools/native_demo.rs"

[[example]]
name = "store_native"
path = "examples/store/native_demo.rs"

[[example]]
name = "perf_probe"
path = "benchmarks/rust/perf_probe.rs"

[[example]]
name = "mega_workflow_native"
path = "benchmarks/rust/mega_workflow_native.rs"

[[example]]
name = "mega_workflow_async_native"
path = "benchmarks/rust/mega_workflow_async_native.rs"
