name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all targets and features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Run tests (async feature)
        run: cargo test --all-targets --features async

      - name: Run persistence tests (SQLite)
        run: cargo test --all-targets --features "async sqlite"

      - name: Run doctests
        run: cargo test --doc

      - name: Build release
        run: cargo build --release

  python:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build the extension module
        run: cargo build --features "python python-async sqlite"

      - name: Make the module importable
        run: |
          mkdir -p target/python
          cp target/debug/liblanggraph_rs.so target/python/langgraph_rs.so

      - name: Run Python binding tests
        run: python3 -m unittest discover -s python/tests -v
        env:
          PYTHONPATH: target/python

      - name: Run the Python example
        run: python3 python/examples/quickstart.py
        env:
          PYTHONPATH: target/python

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings